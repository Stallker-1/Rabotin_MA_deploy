version: '3.8'

services:
  api:
    build: .
    container_name: fastapi-lab
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=production-secret-key-change-me
      - DATABASE_URL=sqlite:///./app.db
      - GUNICORN_WORKERS=2
      - PORT=8000
    volumes:
      - ./app.db:/app/app.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s